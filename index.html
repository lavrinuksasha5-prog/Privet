<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Welcome Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { 
            --bg: var(--tg-theme-bg-color, #121212); 
            --card: var(--tg-theme-secondary-bg-color, #1e1e1e); 
            --text: var(--tg-theme-text-color, #fff); 
            --hint: var(--tg-theme-hint-color, #888); 
            --btn: var(--tg-theme-button-color, #2ea6ff); 
            --success: #2ecc71; 
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; padding-bottom: 80px; }
        
        .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); transition: opacity 0.3s; }
        .card.disabled { opacity: 0.5; }
        
        .switch-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); }

        textarea, input[type="text"], input[type="number"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: var(--bg); color: var(--text); font-size: 14px; box-sizing: border-box; margin-bottom: 8px; }
        textarea { min-height: 80px; font-family: monospace; resize: vertical; }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: var(--success); color: #fff; }
        .btn-test { background: rgba(255,255,255,0.1); color: var(--text); padding: 10px; font-size: 14px; margin-top: 8px; }
        .btn-delete { background: rgba(231, 76, 60, 0.15); color: #e74c3c; padding: 8px 12px; font-size: 13px; font-weight: 600; border-radius: 8px; width: auto; flex: none; margin-top: 0; }
        
        .header { font-size: 20px; font-weight: 700; margin-bottom: 16px; text-align: center; }
        .sub-header { font-size: 12px; color: var(--hint); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 10px 20px; border-radius: 20px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
    </style>
</head>
<body>
    <div class="header">⚙️ Приветствие</div>
    
    <div class="switch-container">
        <div style="font-weight: 600; font-size: 16px;">Главный выключатель</div>
        <label class="switch">
            <input type="checkbox" id="welcome-enabled" onchange="toggleWelcome()">
            <span class="slider"></span>
        </label>
    </div>

    <div id="welcome-messages-list"></div>
    
    <button class="btn btn-primary" onclick="addWelcomeMessage()">➕ Добавить сообщение</button>

    <!-- БЛОК FOMO -->
    <div class="header" style="margin-top: 30px; font-size: 18px;">🔥 Последний шанс (FOMO)</div>
    <div class="card">
        <div class="switch-container" style="margin-bottom: 10px;">
            <div style="font-weight: 600;">Включить повторку</div>
            <label class="switch">
                <input type="checkbox" id="fomo-enabled" onchange="toggleFomo()">
                <span class="slider"></span>
            </label>
        </div>
        <input type="number" id="fomo-delay" placeholder="Задержка (в минутах)" onchange="updateFomo('delay', this.value)" style="margin-bottom: 8px;">
        <textarea id="fomo-text" placeholder="Текст (например: Закрываю вход в VIP, последний шанс -)" onchange="updateFomo('text', this.value)"></textarea>
        <button class="btn btn-test" onclick="testFomo()" style="margin-top: 8px;">👁 Проверить FOMO</button>
    </div>

    <div id="toast">Сохранено!</div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        // Ссылка на твой новый сервис Railway (для приветствий)
        const API_URL = "https://worker-production-01e3.up.railway.app"; 
        let welcomeData = { enabled: false, messages: [], fomo: { enabled: false, delay: 0, text: "" } };

        // 1. Загрузка данных
        async function fetchWelcome() {
            try {
                const res = await fetch(`${API_URL}/api/welcome`);
                welcomeData = await res.json();
                if (!welcomeData.messages) welcomeData.messages = [];
                if (!welcomeData.fomo) welcomeData.fomo = { enabled: false, delay: 0, text: "" };
                
                document.getElementById('welcome-enabled').checked = welcomeData.enabled || false;
                document.getElementById('fomo-enabled').checked = welcomeData.fomo.enabled || false;
                document.getElementById('fomo-delay').value = welcomeData.fomo.delay || '';
                document.getElementById('fomo-text').value = welcomeData.fomo.text || '';
                
                renderWelcomeMessages();
            } catch (e) { console.error("Ошибка загрузки", e); }
        }

        // 2. Отрисовка списка сообщений
        function renderWelcomeMessages() {
            const listEl = document.getElementById('welcome-messages-list');
            if (welcomeData.messages.length === 0) {
                listEl.innerHTML = "<div style='text-align:center; color:var(--hint); padding:20px; font-size:14px;'>Пока нет сообщений.</div>";
                return;
            }
            let html = "";
            welcomeData.messages.forEach((msg, index) => {
                let btnString = "";
                if (msg.buttons && msg.buttons.length > 0) {
                    btnString = msg.buttons.map(b => `${b.text} | ${b.url}`).join("\n");
                }
                const isEnabled = msg.enabled !== false; 
                
                html += `
                    <div class="card ${isEnabled ? '' : 'disabled'}" style="border-left: 4px solid ${isEnabled ? 'var(--btn)' : '#555'};">
                        <div class="sub-header">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <label class="switch" style="width: 34px; height: 18px;">
                                    <input type="checkbox" ${isEnabled ? 'checked' : ''} onchange="toggleMsg(${index}, this.checked)">
                                    <span class="slider" style="border-radius: 34px;"></span>
                                </label>
                                <span>Сообщение #${index + 1}</span>
                            </div>
                            <button class="btn-delete" onclick="removeWelcomeMessage(${index})">Удалить</button>
                        </div>
                        
                        <textarea onchange="updateMsgText(${index}, this.value)" placeholder="Текст сообщения...">${msg.text || ''}</textarea>
                        
                        <input type="text" placeholder="Код медиа (отправь фото боту)" value="${msg.media_url || ''}" onchange="updateMsgMedia(${index}, this.value)">
                        
                        <textarea placeholder="Кнопки (Текст | https://ссылка). Каждая с новой строки." onchange="updateMsgButtons(${index}, this.value)" style="min-height: 50px; font-size: 12px;">${btnString}</textarea>
                        
                        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 8px;">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span style="font-size: 13px; color: var(--hint);">Задержка (сек):</span>
                                <input type="number" value="${msg.delay || 0}" onchange="updateMsgDelay(${index}, this.value)" style="width: 70px; margin-bottom: 0; padding: 8px;">
                            </div>
                            <button class="btn btn-test" onclick="testMessage(${index})" style="width: auto; margin: 0; padding: 8px 16px;">👁 Тест</button>
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        function showToast() {
            const t = document.getElementById('toast');
            t.style.opacity = 1;
            setTimeout(() => { t.style.opacity = 0; }, 1500);
        }

        // 3. FOMO (Последний шанс)
        function toggleFomo() {
            welcomeData.fomo.enabled = document.getElementById('fomo-enabled').checked;
            saveWelcome();
        }
        function updateFomo(key, val) {
            welcomeData.fomo[key] = key === 'delay' ? parseInt(val) : val;
            saveWelcome();
        }
        async function testFomo() {
            const userId = tg.initDataUnsafe?.user?.id;
            if (!userId) return;
            tg.showAlert("Тест FOMO отправлен");
            const msg = { text: welcomeData.fomo.text || "Последний шанс!", buttons: [{text: "Зайти", url: "https://t.me"}] };
            await fetch(`${API_URL}/api/test`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, message: msg })
            });
        }

        // 4. Действия с сообщениями
        function toggleWelcome() { welcomeData.enabled = document.getElementById('welcome-enabled').checked; saveWelcome(); }
        function toggleMsg(index, checked) { welcomeData.messages[index].enabled = checked; saveWelcome(); }
        function addWelcomeMessage() { welcomeData.messages.push({ text: "Привет, {name}!", delay: 0, media_url: "", buttons: [], enabled: true }); saveWelcome(); }
        function removeWelcomeMessage(index) { if(!confirm("Удалить это сообщение?")) return; welcomeData.messages.splice(index, 1); saveWelcome(); }
        function updateMsgText(index, val) { welcomeData.messages[index].text = val; saveWelcome(); }
        function updateMsgMedia(index, val) { welcomeData.messages[index].media_url = val; saveWelcome(); }
        function updateMsgDelay(index, val) { welcomeData.messages[index].delay = parseInt(val) || 0; saveWelcome(); }
        function updateMsgButtons(index, val) {
            const buttons = val.split('\n').filter(l => l.trim()).map(line => {
                const parts = line.split('|');
                return parts.length === 2 ? { text: parts[0].trim(), url: parts[1].trim() } : null;
            }).filter(Boolean);
            welcomeData.messages[index].buttons = buttons;
            saveWelcome();
        }

        // 5. Сохранение и принудительное обновление
        async function saveWelcome() {
            try {
                const res = await fetch(`${API_URL}/api/welcome`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(welcomeData)
                });
                if (res.ok) {
                    showToast();
                    await fetchWelcome(); // Принудительно перечитываем данные с сервера
                } else {
                    tg.showAlert("Ошибка сохранения на сервере");
                }
            } catch (e) { tg.showAlert("Ошибка сети"); }
        }
        
        async function testMessage(index) {
            const msg = welcomeData.messages[index];
            const userId = tg.initDataUnsafe?.user?.id;
            if (!userId) return;
            try {
                await fetch(`${API_URL}/api/test`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, message: msg })
                });
            } catch (e) { tg.showAlert("Ошибка теста"); }
        }

        document.addEventListener('DOMContentLoaded', () => { fetchWelcome(); });
    </script>
</body>
</html>
